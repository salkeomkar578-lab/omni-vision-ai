<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omni Vision AI - Real-time Object Detection</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.8/vision_bundle.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .video-container {
            position: relative;
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
        }

        .camera-wrapper {
            position: relative;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        #webcam {
            width: 100%;
            border-radius: 10px;
            display: none;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 10px;
        }

        .controls {
            text-align: center;
            margin-top: 20px;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            margin: 0 10px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        button:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .stats {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .stat-item {
            text-align: center;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            color: white;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.2rem;
            padding: 20px;
        }

        .error {
            background: #ff4757;
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function ObjectDetectionApp() {
            const [isRunning, setIsRunning] = useState(false);
            const [isLoading, setIsLoading] = useState(true);
            const [error, setError] = useState(null);
            const [detectionCount, setDetectionCount] = useState(0);
            const [fps, setFps] = useState(0);
            const [objectsDetected, setObjectsDetected] = useState(0);

            const videoRef = useRef(null);
            const canvasRef = useRef(null);
            const detectorRef = useRef(null);
            const streamRef = useRef(null);
            const animationRef = useRef(null);
            const lastTimeRef = useRef(Date.now());

            useEffect(() => {
                initializeDetector();
                return () => {
                    stopDetection();
                };
            }, []);

            const initializeDetector = async () => {
                try {
                    setIsLoading(true);
                    const vision = await window.MediaPipeTasksVision.FilesetResolver.forVisionTasks(
                        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.8/wasm"
                    );

                    detectorRef.current = await window.MediaPipeTasksVision.ObjectDetector.createFromOptions(
                        vision,
                        {
                            baseOptions: {
                                modelAssetPath: "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite",
                                delegate: "GPU"
                            },
                            scoreThreshold: 0.5,
                            maxResults: 5,
                            runningMode: "VIDEO"
                        }
                    );

                    setIsLoading(false);
                } catch (err) {
                    console.error("Error initializing detector:", err);
                    setError("Failed to initialize object detector: " + err.message);
                    setIsLoading(false);
                }
            };

            const startDetection = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: { width: 1280, height: 720 }
                    });

                    streamRef.current = stream;
                    videoRef.current.srcObject = stream;
                    
                    await videoRef.current.play();
                    
                    const canvas = canvasRef.current;
                    canvas.width = videoRef.current.videoWidth;
                    canvas.height = videoRef.current.videoHeight;

                    setIsRunning(true);
                    detectFrame();
                } catch (err) {
                    console.error("Error accessing webcam:", err);
                    setError("Failed to access webcam: " + err.message);
                }
            };

            const stopDetection = () => {
                if (animationRef.current) {
                    cancelAnimationFrame(animationRef.current);
                }

                if (streamRef.current) {
                    streamRef.current.getTracks().forEach(track => track.stop());
                }

                if (canvasRef.current) {
                    const ctx = canvasRef.current.getContext('2d');
                    ctx.clearRect(0, 0, canvasRef.current.width, canvasRef.current.height);
                }

                setIsRunning(false);
                setObjectsDetected(0);
            };

            const detectFrame = () => {
                if (!isRunning && animationRef.current) return;

                const video = videoRef.current;
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');

                if (video.readyState === video.HAVE_ENOUGH_DATA) {
                    const startTimeMs = performance.now();

                    // Detect objects
                    const detections = detectorRef.current.detectForVideo(video, startTimeMs);

                    // Clear canvas
                    ctx.clearRect(0, 0, canvas.width, canvas.height);

                    // Draw detections
                    if (detections.detections && detections.detections.length > 0) {
                        setObjectsDetected(detections.detections.length);
                        setDetectionCount(prev => prev + 1);

                        detections.detections.forEach(detection => {
                            const bbox = detection.boundingBox;
                            const category = detection.categories[0];

                            // Draw bounding box
                            ctx.strokeStyle = '#00FF00';
                            ctx.lineWidth = 3;
                            ctx.strokeRect(
                                bbox.originX,
                                bbox.originY,
                                bbox.width,
                                bbox.height
                            );

                            // Draw label background
                            const label = `${category.categoryName} ${Math.round(category.score * 100)}%`;
                            ctx.font = '16px Arial';
                            const textWidth = ctx.measureText(label).width;
                            
                            ctx.fillStyle = '#00FF00';
                            ctx.fillRect(
                                bbox.originX,
                                bbox.originY - 25,
                                textWidth + 10,
                                25
                            );

                            // Draw label text
                            ctx.fillStyle = '#000000';
                            ctx.fillText(
                                label,
                                bbox.originX + 5,
                                bbox.originY - 7
                            );
                        });
                    } else {
                        setObjectsDetected(0);
                    }

                    // Calculate FPS
                    const currentTime = Date.now();
                    const deltaTime = currentTime - lastTimeRef.current;
                    if (deltaTime > 500) {
                        setFps(Math.round(1000 / deltaTime));
                        lastTimeRef.current = currentTime;
                    }
                }

                animationRef.current = requestAnimationFrame(detectFrame);
            };

            return (
                <div className="container">
                    <h1>🎯 Omni Vision AI - Real-time Object Detection</h1>

                    {isLoading && (
                        <div className="loading">
                            Loading MediaPipe Object Detector...
                        </div>
                    )}

                    {error && (
                        <div className="error">
                            {error}
                        </div>
                    )}

                    {!isLoading && !error && (
                        <>
                            <div className="video-container">
                                <div className="camera-wrapper">
                                    <video ref={videoRef} id="webcam" />
                                    <canvas ref={canvasRef} id="canvas" />
                                </div>
                                <div className="controls">
                                    {!isRunning ? (
                                        <button onClick={startDetection}>
                                            🎥 Start Detection
                                        </button>
                                    ) : (
                                        <button onClick={stopDetection}>
                                            ⏹️ Stop Detection
                                        </button>
                                    )}
                                </div>
                            </div>

                            {isRunning && (
                                <div className="stats">
                                    <div className="stat-item">
                                        <div className="stat-value">{fps}</div>
                                        <div className="stat-label">FPS</div>
                                    </div>
                                    <div className="stat-item">
                                        <div className="stat-value">{objectsDetected}</div>
                                        <div className="stat-label">Objects Detected</div>
                                    </div>
                                    <div className="stat-item">
                                        <div className="stat-value">{detectionCount}</div>
                                        <div className="stat-label">Total Detections</div>
                                    </div>
                                </div>
                            )}
                        </>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ObjectDetectionApp />);
    </script>
</body>
</html>
